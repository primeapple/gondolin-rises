---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    assignees:
      - primeapple
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - primeapple
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-ci)"
